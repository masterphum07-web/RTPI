<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กิจกรรม/ข่าวสาร | สาขาวิชารังสีเทคนิค วทก.</title>
  <meta name="theme-color" content="#0f2447">
  <link rel="icon" type="image/png" href="icons/logo-dept.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          navy: {50:'#eef3fb',100:'#d8e3f5',200:'#b3c7e8',600:'#254b85',700:'#1d4076',800:'#16325c',900:'#0f2447'},
          gold: {300:'#e7cf7a',400:'#d4af37',500:'#c9a227',600:'#a9861d'},
        },
        fontFamily: { sans: ['Sarabun','sans-serif'], serif: ['"Noto Serif Thai"','Sarabun','serif'] },
      } }
    };
  </script>
  <link rel="stylesheet" href="css/style.css?v=4">
  <script>(function(){try{var t=localStorage.getItem('rt-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})();</script>
  <script src="js/config.js?v=4"></script>
  <script src="js/data.js?v=4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen flex flex-col">
  <div id="rt-header"></div>

  <main x-data="activitiesPage()" class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <div class="mb-6">
      <h1 class="rt-serif text-2xl sm:text-3xl font-bold rt-navy-text">🎉 กิจกรรมและข่าวสาร</h1>
      <p class="rt-muted-text text-sm mt-1">ประกาศ กิจกรรม ทุนการศึกษา และข่าวฝึกงานของสาขา — โพสต์โดยฝ่ายที่รับผิดชอบผ่าน Google Sheets</p>
    </div>

    <div class="rt-card p-4 mb-5">
      <div class="grid gap-3 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-semibold rt-muted-text mb-1">ค้นหา</label>
          <input type="text" x-model="q" placeholder="ค้นหาจากหัวข้อหรือเนื้อหา…" class="rt-input">
        </div>
        <div class="flex items-end gap-2 flex-wrap">
          <button @click="cat = ''" class="rt-chip" :class="cat === '' ? 'rt-active' : ''">ทุกหมวด</button>
          <template x-for="c in categories" :key="c">
            <button @click="cat = (cat === c ? '' : c)" class="rt-chip" :class="cat === c ? 'rt-active' : ''" x-text="c"></button>
          </template>
        </div>
      </div>
    </div>

    <template x-if="loading">
      <div class="grid gap-4 md:grid-cols-2"><div class="rt-skeleton h-48"></div><div class="rt-skeleton h-48"></div></div>
    </template>

    <template x-if="!loading && filtered.length === 0">
      <div class="rt-empty">
        <p class="text-3xl mb-2">📢</p>
        <p class="font-medium">ไม่พบโพสต์ตามเงื่อนไขที่เลือก</p>
        <p class="text-sm mt-1">เพิ่มโพสต์ได้ที่แท็บ <b>Posts</b> ใน Google Sheets ของสาขา</p>
      </div>
    </template>

    <div class="grid gap-4 md:grid-cols-2">
      <template x-for="p in filtered" :key="p.id || p.title">
        <article class="rt-card overflow-hidden hover:-translate-y-0.5 transition-all flex flex-col"
                 :class="p.pinned === 'TRUE' ? '!border-gold-500/60' : ''">
          <template x-if="p.image">
            <img :src="rtDirectImage(p.image)" :alt="p.title" class="w-full h-44 object-cover cursor-zoom-in"
                 loading="lazy" @click="rtOpenLightbox(rtDirectImage(p.image), p.title)">
          </template>
          <div class="p-5 flex-1 flex flex-col">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="text-xs font-semibold rounded-full px-2.5 py-1"
                    :class="{'bg-blue-100 text-blue-700': p.category==='กิจกรรม', 'rt-navy-soft rt-navy-text': p.category==='ประกาศทั่วไป', 'bg-emerald-100 text-emerald-700': p.category==='ทุนการศึกษา', 'bg-purple-100 text-purple-700': p.category==='ฝึกงาน/สมัครงาน', 'bg-slate-100 text-slate-600': !['กิจกรรม','ประกาศทั่วไป','ทุนการศึกษา','ฝึกงาน/สมัครงาน'].includes(p.category)}"
                    x-text="p.category || 'ทั่วไป'"></span>
              <span x-show="p.pinned === 'TRUE'" class="text-xs text-gold-600 font-semibold">📌 ปักหมุด</span>
              <span class="text-xs rt-muted-text ml-auto" x-text="rtThaiDate(p.date)"></span>
            </div>
            <h2 class="rt-serif font-bold rt-navy-text text-lg leading-snug" x-text="p.title"></h2>
            <p class="text-sm rt-muted-text mt-2 whitespace-pre-line flex-1" x-text="p.body"></p>
            <div class="mt-4 pt-3 border-t border-[var(--rt-border)] flex items-center justify-between gap-2">
              <span class="text-xs rt-muted-text" x-text="'โดย ' + (p.author || '-')"></span>
              <a x-show="p.link" :href="p.link" target="_blank" rel="noopener"
                 class="text-sm font-medium rt-navy-text hover:opacity-70 underline decoration-gold-500/60">อ่านเพิ่มเติม →</a>
            </div>
          </div>
        </article>
      </template>
    </div>
    <p class="text-xs rt-muted-text mt-3" x-show="!loading">แสดง <span x-text="filtered.length"></span> โพสต์ · อัปเดตอัตโนมัติทุก <span x-text="RT_CONFIG.POLL_SECONDS"></span> วินาที</p>
  </main>

  <div id="rt-footer"></div>

  <script src="js/ui.js?v=4"></script>
  <script>
    rtRenderHeader('activities');
    rtRenderFooter();

    function activitiesPage() {
      return {
        loading: true,
        posts: [],
        q: '',
        cat: '',
        async init() {
          this.apply(await RTData.load());
          document.addEventListener('rt:updated', e => this.apply(e.detail));
        },
        apply(d) {
          this.posts = d.posts;
          this.loading = false;
        },
        get categories() { return [...new Set(this.posts.map(p => p.category))].filter(Boolean); },
        get filtered() {
          const q = this.q.trim().toLowerCase();
          return this.posts
            .filter(p =>
              (!this.cat || p.category === this.cat) &&
              (!q || (p.title + ' ' + p.body).toLowerCase().includes(q))
            )
            .sort((a, b) => (b.pinned === 'TRUE') - (a.pinned === 'TRUE') || (b.date || '').localeCompare(a.date || ''));
        },
      };
    }
  </script>
</body>
</html>

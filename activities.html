<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กิจกรรม/ข่าวสาร | สาขาวิชารังสีเทคนิค วทก.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          navy: {50:'#eef3fb',100:'#d8e3f5',200:'#b3c7e8',600:'#254b85',700:'#1d4076',800:'#16325c',900:'#0f2447'},
          gold: {400:'#d4af37',500:'#c9a227',600:'#a9861d'},
        },
        fontFamily: { sans: ['Sarabun','sans-serif'] },
      } }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/data.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <div id="rt-header"></div>

  <main x-data="activitiesPage()" class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-navy-800">🎉 กิจกรรมและข่าวสาร</h1>
      <p class="text-slate-500 text-sm mt-1">ประกาศ กิจกรรม ทุนการศึกษา และข่าวฝึกงานของสาขา — โพสต์โดยฝ่ายที่รับผิดชอบ</p>
    </div>

    <!-- ตัวกรอง -->
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-5">
      <div class="grid gap-3 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">ค้นหา</label>
          <input type="text" x-model="q" placeholder="ค้นหาจากหัวข้อหรือเนื้อหา…"
                 class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-navy-200 focus:border-navy-500">
        </div>
        <div class="flex items-end gap-2 flex-wrap">
          <button @click="cat = ''" class="text-sm rounded-full px-3.5 py-1.5 font-medium border transition"
                  :class="cat === '' ? 'bg-navy-800 text-white border-navy-800' : 'bg-white border-slate-300 text-slate-600 hover:border-navy-400'">ทุกหมวด</button>
          <template x-for="c in categories" :key="c">
            <button @click="cat = (cat === c ? '' : c)" class="text-sm rounded-full px-3.5 py-1.5 font-medium border transition"
                    :class="cat === c ? 'bg-navy-800 text-white border-navy-800' : 'bg-white border-slate-300 text-slate-600 hover:border-navy-400'"
                    x-text="c"></button>
          </template>
        </div>
      </div>
    </div>

    <!-- ฟีด -->
    <div x-show="loading" class="text-slate-400 py-10 text-center">กำลังโหลดข้อมูล…</div>
    <div x-show="!loading && filtered.length === 0" class="bg-white rounded-xl border border-slate-200 text-slate-400 py-10 text-center">ไม่พบโพสต์ตามเงื่อนไขที่เลือก</div>

    <div class="grid gap-4 md:grid-cols-2">
      <template x-for="p in filtered" :key="p.id">
        <article class="bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col"
                 :class="p.pinned === 'TRUE' ? 'border-gold-500/60 ring-1 ring-gold-500/30' : ''">
          <img x-show="p.image" :src="p.image" :alt="p.title" class="w-full h-44 object-cover" loading="lazy">
          <div class="p-5 flex-1 flex flex-col">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="text-xs font-semibold rounded-full px-2.5 py-1"
                    :class="{'bg-blue-100 text-blue-700': p.category==='กิจกรรม', 'bg-navy-100 text-navy-700': p.category==='ประกาศทั่วไป', 'bg-emerald-100 text-emerald-700': p.category==='ทุนการศึกษา', 'bg-purple-100 text-purple-700': p.category==='ฝึกงาน/สมัครงาน', 'bg-slate-100 text-slate-600': !['กิจกรรม','ประกาศทั่วไป','ทุนการศึกษา','ฝึกงาน/สมัครงาน'].includes(p.category)}"
                    x-text="p.category"></span>
              <span x-show="p.pinned === 'TRUE'" class="text-xs text-gold-600 font-semibold">📌 ปักหมุด</span>
              <span class="text-xs text-slate-400 ml-auto" x-text="rtThaiDate(p.date)"></span>
            </div>
            <h2 class="font-bold text-navy-800 text-lg leading-snug" x-text="p.title"></h2>
            <p class="text-sm text-slate-600 mt-2 whitespace-pre-line flex-1" x-text="p.body"></p>
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
              <span class="text-xs text-slate-400" x-text="'โดย ' + (p.author || '-')"></span>
              <a x-show="p.link" :href="p.link" target="_blank" rel="noopener"
                 class="text-sm font-medium text-navy-600 hover:text-navy-800 underline">อ่านเพิ่มเติม →</a>
            </div>
          </div>
        </article>
      </template>
    </div>
    <p class="text-xs text-slate-400 mt-3">แสดง <span x-text="filtered.length"></span> โพสต์ · ข้อมูลอัปเดตอัตโนมัติทุก <span x-text="RT_CONFIG.POLL_SECONDS"></span> วินาที</p>
  </main>

  <div id="rt-footer"></div>

  <script src="js/ui.js"></script>
  <script>
    rtRenderHeader('activities');
    rtRenderFooter();

    function activitiesPage() {
      return {
        loading: true,
        posts: [],
        q: '',
        cat: '',
        async init() {
          this.apply(await RTData.load());
          document.addEventListener('rt:updated', e => this.apply(e.detail));
        },
        apply(d) {
          this.posts = d.posts;
          this.loading = false;
        },
        get categories() { return [...new Set(this.posts.map(p => p.category))].filter(Boolean); },
        get filtered() {
          const q = this.q.trim().toLowerCase();
          return this.posts
            .filter(p =>
              (!this.cat || p.category === this.cat) &&
              (!q || (p.title + ' ' + p.body).toLowerCase().includes(q))
            )
            .sort((a, b) => (b.pinned === 'TRUE') - (a.pinned === 'TRUE') || b.date.localeCompare(a.date));
        },
      };
    }
  </script>
</body>
</html>

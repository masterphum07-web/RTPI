<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางสอน | สาขาวิชารังสีเทคนิค วทก.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          navy: {50:'#eef3fb',100:'#d8e3f5',200:'#b3c7e8',600:'#254b85',700:'#1d4076',800:'#16325c',900:'#0f2447'},
          gold: {400:'#d4af37',500:'#c9a227',600:'#a9861d'},
        },
        fontFamily: { sans: ['Sarabun','sans-serif'] },
      } }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/data.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <div id="rt-header"></div>

  <main x-data="schedulePage()" class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-navy-800">📚 ตารางสอน</h1>
        <p class="text-slate-500 text-sm mt-1">ตารางเรียนรายสัปดาห์ แยกตามปีการศึกษา ภาคเรียน และกลุ่มเรียน</p>
      </div>
      <button onclick="window.print()" class="rt-noprint text-sm border border-slate-300 hover:border-navy-500 rounded-lg px-4 py-2 font-medium transition">🖨 พิมพ์ตาราง</button>
    </div>

    <!-- ตัวกรอง -->
    <div class="bg-white rounded-xl border border-slate-200 p-4 mb-5 rt-noprint">
      <div class="grid gap-3 sm:grid-cols-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">ปีการศึกษา</label>
          <select x-model="year" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-navy-200">
            <option value="">ทั้งหมด</option>
            <template x-for="y in years" :key="y"><option :value="y" x-text="y"></option></template>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">ภาคเรียน</label>
          <select x-model="term" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-navy-200">
            <option value="">ทั้งหมด</option>
            <template x-for="t in terms" :key="t"><option :value="t" x-text="t"></option></template>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">กลุ่มเรียน</label>
          <select x-model="group" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-navy-200">
            <option value="">ทุกกลุ่ม</option>
            <template x-for="g in groups" :key="g"><option :value="g" x-text="g"></option></template>
          </select>
        </div>
      </div>
    </div>

    <!-- ตารางรายวัน -->
    <div x-show="loading" class="text-slate-400 py-10 text-center">กำลังโหลดข้อมูล…</div>
    <div x-show="!loading && byDay.length === 0" class="bg-white rounded-xl border border-slate-200 text-slate-400 py-10 text-center">ไม่พบตารางสอนตามเงื่อนไขที่เลือก</div>

    <div class="space-y-5">
      <template x-for="[day, rows] in byDay" :key="day">
        <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div class="bg-navy-50 border-b border-slate-200 px-5 py-3 flex items-center gap-3">
            <span class="rt-day-badge" x-text="day.slice(0, 1)"></span>
            <div>
              <h2 class="font-bold text-navy-800" x-text="'วัน' + day"></h2>
              <p class="text-xs text-slate-500" x-text="rows.length + ' คาบเรียน'"></p>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="rt-table">
              <thead>
                <tr><th>เวลา</th><th>รหัสวิชา</th><th>รายวิชา</th><th>ห้อง</th><th>อาจารย์ผู้สอน</th><th>กลุ่มเรียน</th></tr>
              </thead>
              <tbody>
                <template x-for="(r, i) in rows" :key="i">
                  <tr>
                    <td class="whitespace-nowrap font-semibold text-navy-800" x-text="r.timeStart + ' - ' + r.timeEnd"></td>
                    <td class="whitespace-nowrap text-slate-500" x-text="r.code"></td>
                    <td x-text="r.subject"></td>
                    <td x-text="r.room"></td>
                    <td x-text="r.teacher"></td>
                    <td><span class="text-xs bg-navy-50 text-navy-700 rounded px-2 py-0.5 font-medium whitespace-nowrap" x-text="r.group"></span></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>
      </template>
    </div>
    <p class="text-xs text-slate-400 mt-3">แสดง <span x-text="filtered.length"></span> คาบเรียน · ข้อมูลอัปเดตอัตโนมัติทุก <span x-text="RT_CONFIG.POLL_SECONDS"></span> วินาที</p>
  </main>

  <div id="rt-footer"></div>

  <script src="js/ui.js"></script>
  <script>
    rtRenderHeader('schedule');
    rtRenderFooter();

    function schedulePage() {
      const DAY_ORDER = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์', 'อาทิตย์'];
      return {
        loading: true,
        cfg: {},
        schedule: [],
        year: '',
        term: '',
        group: '',
        async init() {
          this.apply(await RTData.load());
          document.addEventListener('rt:updated', e => this.apply(e.detail));
        },
        apply(d) {
          this.cfg = d.config;
          this.schedule = d.schedule;
          if (!this.year && d.config.currentYear && d.schedule.some(r => r.year === d.config.currentYear)) {
            this.year = d.config.currentYear;
          }
          this.loading = false;
        },
        get years() { return [...new Set(this.schedule.map(r => r.year))].sort().reverse(); },
        get terms() { return [...new Set(this.schedule.filter(r => !this.year || r.year === this.year).map(r => r.term))]; },
        get groups() { return [...new Set(this.schedule.filter(r => (!this.year || r.year === this.year) && (!this.term || r.term === this.term)).map(r => r.group))].sort(); },
        get filtered() {
          return this.schedule
            .filter(r =>
              (!this.year || r.year === this.year) &&
              (!this.term || r.term === this.term) &&
              (!this.group || r.group === this.group)
            )
            .sort((a, b) =>
              DAY_ORDER.indexOf(a.day) - DAY_ORDER.indexOf(b.day) ||
              (a.timeStart || '').localeCompare(b.timeStart || '')
            );
        },
        get byDay() {
          const map = {};
          this.filtered.forEach(r => { (map[r.day] = map[r.day] || []).push(r); });
          return Object.entries(map).sort((a, b) => DAY_ORDER.indexOf(a[0]) - DAY_ORDER.indexOf(b[0]));
        },
      };
    }
  </script>
</body>
</html>
